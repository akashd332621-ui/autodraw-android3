name: Build AutoDraw APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/autodraw/mobile app/src/main/res/values app/src/main/res/xml
          echo  | base64 -d > "settings.gradle.kts"
          echo cGx1Z2lucyB7CiAgICBp
